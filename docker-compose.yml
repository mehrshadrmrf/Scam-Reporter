version: "3.9"

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  api:
    <<: *app-build
    container_name: scamreport_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    networks:
      - scamreport_net

  bot:
    <<: *app-build
    container_name: scamreport_bot
    command: python -m app.bot.bot
    networks:
      - scamreport_net

  migrator:
    <<: *app-build
    container_name: scamreport_migrator
    command: alembic upgrade head
    restart: "no"
    networks:
      - scamreport_net

  db:
    image: postgres:16-alpine
    container_name: scamreport_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scamreport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-scamreport}
    volumes:
      - scamreport_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scamreport}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scamreport_net

  redis:
    image: redis:7-alpine
    container_name: scamreport_redis
    volumes:
      - scamreport_redisdata:/data
    networks:
      - scamreport_net

  minio:
    image: minio/minio:latest
    container_name: scamreport_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - scamreport_miniodata:/data
    networks:
      - scamreport_net

  nginx:
    image: nginx:alpine
    container_name: scamreport_nginx
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - scamreport_net

  prometheus:
    image: prom/prometheus:latest
    container_name: scamreport_prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - scamreport_net

  grafana:
    image: grafana/grafana:latest
    container_name: scamreport_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    ports:
      - "3000:3000"
    volumes:
      - scamreport_grafanadata:/var/lib/grafana
    networks:
      - scamreport_net

networks:
  scamreport_net:
    driver: bridge

volumes:
  scamreport_pgdata:
  scamreport_redisdata:
  scamreport_miniodata:
  scamreport_grafanadata:
